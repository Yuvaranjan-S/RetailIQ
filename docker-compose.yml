version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: retailiq_postgres
    environment:
      POSTGRES_USER: retailiq
      POSTGRES_PASSWORD: retailiq_pass
      POSTGRES_DB: retailiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: retailiq_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://retailiq:retailiq_pass@postgres:5432/retailiq
      - DATABASE_URL_SYNC=postgresql://retailiq:retailiq_pass@postgres:5432/retailiq
      - APP_SECRET_KEY=docker-secret-change-in-production
      - JWT_SECRET_KEY=docker-jwt-secret-change-in-production
      - SIMULATION_MODE=true
      - APP_ENV=development
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  simulator:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: retailiq_simulator
    environment:
      - DATABASE_URL=postgresql+asyncpg://retailiq:retailiq_pass@postgres:5432/retailiq
      - DATABASE_URL_SYNC=postgresql://retailiq:retailiq_pass@postgres:5432/retailiq
      - BACKEND_URL=http://backend:8000
      - SIMULATION_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./simulator:/simulator
    working_dir: /
    command: python /simulator/store_simulator.py

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: retailiq_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
