services:
  # Backend API + Simulator + Digital Twin (Python Web Service)
  - type: web
    name: retailiq-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.database.seed && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./retailiq.db
      - key: DATABASE_URL_SYNC
        value: sqlite:///./retailiq.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SIMULATION_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Web App (Static Site)
  - type: web
    name: retailiq-dashboard
    runtime: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
